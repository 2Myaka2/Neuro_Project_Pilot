[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-stability-pilot"
version = "0.1.0"
readme = "README_rus.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
graph-swarm-v1 = "neuropp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
